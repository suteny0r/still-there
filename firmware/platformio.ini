; Seeed Studio XIAO ESP32S3 Sense tracking turret
; Toolchain: PlatformIO espressif32 6.13.0 (Arduino core 2.0.17).
; Arduino 2.0.x ships the esp-dl face-detection archives (libhuman_face_detect, libdl);
; Arduino 3.x does not, so face tracking is only available with this environment.
; Motion tracking and manual control build on both.

[platformio]
default_envs = xiao_esp32s3_sense

[base]
platform = espressif32 @ 6.13.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
board_build.flash_size = 8MB
build_flags =
    -DBOARD_HAS_PSRAM
    -DCAMERA_MODEL_XIAO_ESP32S3
    -DCORE_DEBUG_LEVEL=1
    -DFACE_TWO_STAGE=1
    -Wno-unused-variable
    -Wno-unused-function
; the vendored esp-dl 3.x libraries are for env:xiao_espdet only
lib_ignore =
    espdl
    pedestrian_detect

; Bare board (servos on D0/D1, laser D2, button D3)
[env:xiao_esp32s3_sense]
extends = base

; Board seated on the Seeed XIAO Expansion Board: SSD1306 OLED status page, buzzer cues,
; its user button as trigger; tilt servo moves to D2, laser to D6.
; U8g2 is taken from the Arduino IDE library folder (already installed there).
[env:xiao_expansion]
extends = base
build_flags =
    ${base.build_flags}
    -DEXPANSION_BOARD=1
lib_extra_dirs = C:/Users/User/Documents/Arduino/libraries
lib_deps = U8g2

; ---------------------------------------------------------------------------------------
; ESPDet-Pico person detection (branch espdet-pico). Plain Arduino on the pioarduino platform
; (Arduino 3.3.x / IDF 5.5 SDK), which is what your other pioarduino projects already use.
; esp-dl 3.3.11 (lib/espdl, ESP32-S3 subset) and espressif/pedestrian_detect 0.3.2
; (lib/pedestrian_detect, model embedded in flash rodata) are vendored as PlatformIO libraries,
; so no IDF CMake build or component manager is involved. The esp-dl 1.x face models are not
; available on this core; Person mode acquires on the whole body instead (masked / from behind ok).
; Expansion board OLED (U8g2) and buzzer enabled, same as xiao_expansion.
; ---------------------------------------------------------------------------------------
[env:xiao_espdet]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
; XIAO ESP32S3 *Plus* (16 MB flash): project board file in boards/, variant from the 3.3.x core
board = seeed_xiao_esp32s3_plus
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
extra_scripts = pre:link_fbs.py
build_flags =
    -DBOARD_HAS_PSRAM
    -DCAMERA_MODEL_XIAO_ESP32S3
    -DCORE_DEBUG_LEVEL=1
    -Wno-unused-variable
    -Wno-unused-function
    ; esp-dl include roots (lib/espdl)
    -Ilib/espdl/dl -Ilib/espdl/dl/tool/include -Ilib/espdl/dl/tensor/include -Ilib/espdl/dl/base
    -Ilib/espdl/dl/base/isa -Ilib/espdl/dl/base/isa/tie728 -Ilib/espdl/dl/base/isa/xtensa
    -Ilib/espdl/dl/math/include -Ilib/espdl/dl/model/include -Ilib/espdl/dl/module/include
    -Ilib/espdl/fbs_loader/include -Ilib/espdl/vision/detect -Ilib/espdl/vision/image
    -Ilib/espdl/vision/image/isa -Ilib/pedestrian_detect
    ; esp-dl Kconfig equivalents (pixel conversions compiled in; no YUV / HSV / JPEG / PPA)
    -DCONFIG_PIX_CVT_RGB565_TO_RGB888_SUPPORT=1 -DCONFIG_PIX_CVT_RGB565_TO_RGB565_SUPPORT=1
    -DCONFIG_PIX_CVT_RGB565_TO_GRAY_SUPPORT=1 -DCONFIG_PIX_CVT_RGB888_TO_RGB888_SUPPORT=1
    -DCONFIG_PIX_CVT_RGB888_TO_RGB565_SUPPORT=1 -DCONFIG_PIX_CVT_RGB888_TO_GRAY_SUPPORT=1
    -DCONFIG_PIX_CVT_GRAY_TO_GRAY_SUPPORT=1
    ; pedestrian_detect Kconfig equivalents: PICO_S8_V1, model in flash rodata
    -DCONFIG_PEDESTRIAN_DETECT_MODEL_IN_FLASH_RODATA=1 -DCONFIG_PEDESTRIAN_DETECT_MODEL_LOCATION=0
    -DCONFIG_FLASH_PEDESTRIAN_DETECT_PICO_S8_V1=1 -DCONFIG_DEFAULT_PEDESTRIAN_DETECT_MODEL=0
lib_extra_dirs = C:/Users/User/Documents/Arduino/libraries
lib_deps =
    espdl
    pedestrian_detect
    U8g2

; Same build for the XIAO on the Seeed Expansion Board (OLED, buzzer, button): bench use only.
; Pin map differs: tilt D2, laser D6, button D1, buzzer D3 (see include/config.h).
[env:xiao_espdet_expansion]
extends = env:xiao_espdet
build_flags =
    ${env:xiao_espdet.build_flags}
    -DEXPANSION_BOARD=1
